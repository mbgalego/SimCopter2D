<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="heliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Radar circles -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Crosshairs -->
  <line x1="256" y1="36" x2="256" y2="476" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.25"/>
  <line x1="36" y1="256" x2="476" y2="256" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Rotor Wash / Blur circle -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="30 20"/>

  <!-- Rotor Blades -->
  <g filter="url(#glow)">
    <line x1="66" y1="256" x2="446" y2="256" stroke="url(#bladeGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="256" y1="66" x2="256" y2="446" stroke="url(#bladeGrad)" stroke-width="10" stroke-linecap="round"/>
    <!-- Blade tip markers -->
    <circle cx="66" cy="256" r="6" fill="#ef4444"/>
    <circle cx="446" cy="256" r="6" fill="#ef4444"/>
    <circle cx="256" cy="66" r="6" fill="#ef4444"/>
    <circle cx="256" cy="446" r="6" fill="#ef4444"/>
  </g>

  <!-- Helicopter Body (Top-down view) -->
  <g>
    <!-- Tail Boom -->
    <path d="M 256 260 L 256 410" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
    <!-- Tail Fin & Tail Rotor -->
    <path d="M 250 410 L 262 410 L 262 425 L 250 425 Z" fill="#ef4444"/>
    <line x1="235" y1="416" x2="277" y2="416" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Skids -->
    <line x1="205" y1="210" x2="205" y2="310" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <line x1="307" y1="210" x2="307" y2="310" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <line x1="205" y1="235" x2="256" y2="235" stroke="#64748b" stroke-width="4"/>
    <line x1="205" y1="285" x2="256" y2="285" stroke="#64748b" stroke-width="4"/>
    <line x1="307" y1="235" x2="256" y2="235" stroke="#64748b" stroke-width="4"/>
    <line x1="307" y1="285" x2="256" y2="285" stroke="#64748b" stroke-width="4"/>

    <!-- Main Fuselage -->
    <ellipse cx="256" cy="250" rx="38" ry="60" fill="url(#heliGrad)"/>
    <!-- Windshield Cockpit Glass -->
    <path d="M 230 226 C 235 200, 277 200, 282 226 C 275 235, 237 235, 230 226 Z" fill="#0284c7" opacity="0.9"/>
    
    <!-- Rotor Hub -->
    <circle cx="256" cy="256" r="14" fill="#0f172a" stroke="#f8fafc" stroke-width="3"/>
    <circle cx="256" cy="256" r="5" fill="#f59e0b"/>
  </g>

  <!-- Emergency Badge / Red Cross icon on lower corner -->
  <g transform="translate(370, 370)">
    <circle cx="36" cy="36" r="36" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
    <rect x="29" y="16" width="14" height="40" rx="3" fill="#ffffff"/>
    <rect x="16" y="29" width="40" height="14" rx="3" fill="#ffffff"/>
  </g>

  <!-- Searchlight Beam indicator in top left -->
  <polygon points="256,210 200,100 312,100" fill="#38bdf8" opacity="0.25"/>
</svg>
